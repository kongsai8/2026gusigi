<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 제2회 거시기 연말 시상식</title>

    <style>
        /* 기본 설정 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #282828;
            color: #ffffff;
            text-align: center;
        }

        /* 📍 좌측 상단 버튼 그룹 (화면 고정) */
        .top-left-nav {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 12px;
            z-index: 2000;
        }

        .nav-btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ffffff;
        }

        /* 📍 우측 상단 타이틀 텍스트 (화면 고정) */
        .top-right-title {
            position: fixed;
            top: 24px;
            right: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: -0.5px;
            white-space: nowrap;
            z-index: 2000;
        }

        /* 🔴 좌측 인디케이터 (5개로 확충) */
        .indicator {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 1000;
            color: #ffffff;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #ffffff;
            opacity: 0.3;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .dot.active {
            width: 18px;
            height: 18px;
            opacity: 1;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            transform: translateX(-4px);
        }

        /* 📜 풀페이지 슬라이더 컨테이너 */
        .fullpage-container {
            width: 100%;
            height: 100%;
            transition: transform 0.7s cubic-bezier(0.65, 0, 0.35, 1);
        }

        /* 공통 섹션 스타일 */
        .section {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            background-color: #282828;
            color: #ffffff;
            padding: 20px;
        }

        /* 🎨 PAGE 1 ~ PAGE 5 전체 가로 그라데이션 배경 통일 */
        .section:nth-child(1),
        .section:nth-child(2),
        .section:nth-child(3),
        .section:nth-child(4),
        .section:nth-child(5) {
            background: linear-gradient(to right, #9c9191, #c1b6b6, #9c9191);
        }

        /* 🖼️ PAGE 1 이미지 + 하단 문구 컨테이너 */
        .page1-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .page1-image {
            max-width: 80%;
            max-height: 65vh;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .page1-notice {
            font-size: 0.78rem;
            color: rgba(40, 40, 40, 0.75);
            line-height: 1.4;
            word-break: keep-all;
        }

        /* 🏆 PAGE 2 수상 부문 컨테이너 */

            max-width: 850px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            color: #282828;

            -webkit-overflow-scrolling: touch;

            font-weight: 800;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
            color: #8f2222;
        }

        .awards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            text-align: left;
        }

        .award-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(5px);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.6);

            flex-direction: column;
            gap: 4px;

        .award-name {

            width: 100%;

            width: 85%;
            max-width: 650px;
            min-height: 380px;
            box-sizing: border-box;

            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            overflow: visible;

        .slide-card.active {

        }

        .slide-img {
            max-width: 100%;
            max-height: 52vh;
            border-radius: 10px;
            object-fit: contain;
            margin-bottom: 16px;
            cursor: zoom-in;
            transition: transform 0.2s ease;
        }

        .slide-img:hover {
            transform: scale(1.02);
        }

        .slide-caption {
            font-size: 1.25rem;
            font-weight: 800;
            color: #1a1a1a;
            line-height: 1.4;
            word-break: keep-all;
        }

        .slide-sub-caption {
            font-size: 0.92rem;
            color: rgba(40, 40, 40, 0.85);
            margin-top: 6px;
            word-break: keep-all;

        .slide-card.text-only .slide-caption {
            font-size: 1.7rem;
            font-weight: 800;
            color: #1a1a1a;
            padding: 50px 10px;
        }
