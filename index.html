<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 제2회 거시기 연말 시상식</title>

    <style>
        /* 웹페이지 기본 및 배경 스타일 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-top: 80px;   /* 상단바에 내용이 가려지지 않도록 여백 지정 */
            padding-bottom: 100px; /* 하단 고정 버튼 여백 */
            
            background: linear-gradient(to bottom, #000000 0%, #d63384 100%);
            color: white;
            text-align: center;
            background-attachment: fixed;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 🔝 상단바 고정 스타일 */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.6); /* 반투명 검정 배경 */
            backdrop-filter: blur(8px);       /* 블러 효과 */
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 2000;

            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }

        /* 좌측 탭 목록 (버튼) */
        .nav-left {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ffffff;
        }

        /* 중앙 제목 */
        .nav-center-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: -0.5px;
            white-space: nowrap;
        }

        /* 중앙 카드 상자 스타일 */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 180px);
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.12);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            width: 85%;
            max-width: 650px;
        }

        /* 하단 고정 이미지 버튼 스타일 */
        .fixed-bottom-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: inline-block;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .fixed-bottom-btn:active {
            transform: translateX(-50%) scale(0.95);
        }

        .fixed-bottom-btn img {
            width: 300px;
            max-width: 85vw;
            height: auto;
            display: block;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        /* 📱 모바일 화면 대응 (제목 글자 크기 살짝 조정) */
        @media (max-width: 600px) {
            .nav-center-title {
                font-size: 0.95rem;
            }
            .nav-btn {
                font-size: 0.75rem;
                padding: 5px 8px;
            }
        }
    </style>
</head>
<body>

    <!-- 🔝 상단바 헤더 영역 -->
    <header class="top-navbar">
        <div class="nav-left">
            <a href="#apply" class="nav-btn">참가지원서작성</a>
            <a href="#vote" class="nav-btn">투표참여</a>
        </div>
        <div class="nav-center-title">
            2026 제2회 거시기 연말 시상식
        </div>
        <!-- 우측 여백 밸런스용 빈 공간 -->
        <div style="width: 40px;"></div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <div class="main-container">
        <div class="card">
            <h1>👋 Welcome!</h1>
            <p>2026 제2회 거시기 연말 시상식 메인 페이지입니다.</p>
        </div>
    </div>

    <!-- 하단 고정 이미지 버튼 -->
    <a href="#" class="fixed-bottom-btn">
        <img src="https://via.placeholder.com/300x80/d63384/ffffff?text=Button" alt="하단 고정 버튼">
    </a>

</body>
</html>
