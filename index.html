<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 제2회 거시기 연말 시상식</title>

    <style>
        /* 기본 설정 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #282828;
            color: #ffffff;
            text-align: center;
        }

        /* 📍 좌측 상단 버튼 그룹 (화면 고정) */
        .top-left-nav {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 12px;
            z-index: 2000;
        }

        .nav-btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ffffff;
        }

        /* 📍 우측 상단 타이틀 텍스트 (화면 고정) */
        .top-right-title {
            position: fixed;
            top: 24px;
            right: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: -0.5px;
            white-space: nowrap;
            z-index: 2000;
        }

        /* 🔴 좌측 인디케이터 */
        .indicator {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 1000;
            color: #ffffff;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #ffffff;
            opacity: 0.3;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .dot.active {
            width: 18px;
            height: 18px;
            opacity: 1;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            transform: translateX(-4px);
        }

        /* 📜 풀페이지 슬라이더 컨테이너 */
        .fullpage-container {
            width: 100%;
            height: 100%;
            transition: transform 0.7s cubic-bezier(0.65, 0, 0.35, 1);
        }

        /* 공통 섹션 스타일 */
        .section {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            background-color: #282828;
            color: #ffffff;
            padding: 20px;
        }

        /* 🎨 PAGE 1 전용 배경 (가로 방향: #9c9191 -> #c1b6b6 -> #9c9191) */
        .section:nth-child(1) {
            background: linear-gradient(to right, #9c9191, #c1b6b6, #9c9191);
        }

        /* 🖼️ 페이지 1 반응형 메인 이미지 스타일 */
        .page1-image {
            max-width: 80%;        /* PC 화면 기준 최대 가로 폭 */
            max-height: 70vh;      /* 위아래 가려지지 않게 세로 비율 제한 */
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        /* 📱 모바일 화면 대응 */
        @media (max-width: 600px) {
            .top-left-nav {
                top: 15px;
                left: 12px;
                gap: 8px;
            }
            .nav-btn {
                font-size: 0.75rem;
                padding: 6px 10px;
            }
            .top-right-title {
                top: 20px;
                right: 12px;
                font-size: 0.85rem;
            }
            .indicator {
                left: 12px;
            }
            .page1-image {
                max-width: 90%;    /* 모바일에서는 가로 꽉 차게 조절 */
            }
        }
    </style>
</head>
<body>

    <!-- 📍 좌측 상단 버튼 -->
    <div class="top-left-nav">
        <a href="#apply" class="nav-btn">참가지원서작성</a>
        <a href="#vote" class="nav-btn">투표참여</a>
    </div>

    <!-- 📍 우측 상단 타이틀 -->
    <div class="top-right-title">
        2026 제2회 거시기 연말 시상식
    </div>

    <!-- 🔴 좌측 인디케이터 (세로 점 4개) -->
    <div class="indicator">
        <div class="dot active" onclick="scrollToSection(0)"></div>
        <div class="dot" onclick="scrollToSection(1)"></div>
        <div class="dot" onclick="scrollToSection(2)"></div>
        <div class="dot" onclick="scrollToSection(3)"></div>
    </div>

    <!-- 📜 메인 4개 섹션 영역 -->
    <div class="fullpage-container" id="mainContainer">
        <!-- PAGE 1: 가로 그라데이션 배경 + page1_2.png 이미지 배치 -->
        <section class="section">
            <img src="page1_2.png" alt="2026 거시기 시상식 메인 로고" class="page1-image">
        </section>
        
        <section class="section">
            <h1>PAGE 2</h1>
        </section>
        <section class="section">
            <h1>PAGE 3</h1>
        </section>
        <section class="section">
            <h1>PAGE 4</h1>
        </section>
    </div>

    <script>
        let currentIdx = 0;
        const totalSections = 4;
        let isScrolling = false;
        const container = document.getElementById('mainContainer');
        const dots = document.querySelectorAll('.dot');

        function scrollToSection(index) {
            currentIdx = index;
            container.style.transform = `translateY(-${currentIdx * 100}vh)`;

            dots.forEach((dot, idx) => {
                if (idx === currentIdx) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        scrollToSection(0);

        // 휠 스크롤 이벤트 (PC)
        window.addEventListener('wheel', (e) => {
            if (isScrolling) return;
            isScrolling = true;

            if (e.deltaY > 0) {
                if (currentIdx === totalSections - 1) {
                    scrollToSection(0);
                } else {
                    scrollToSection(currentIdx + 1);
                }
            } else {
                if (currentIdx === 0) {
                    scrollToSection(totalSections - 1);
                } else {
                    scrollToSection(currentIdx - 1);
                }
            }

            setTimeout(() => {
                isScrolling = false;
            }, 700);
        }, { passive: true });

        // 터치 스와이프 이벤트 (모바일)
        let startY = 0;
        window.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', (e) => {
            if (isScrolling) return;
            const endY = e.changedTouches[0].clientY;
            const diffY = startY - endY;

            if (Math.abs(diffY) > 50) {
                isScrolling = true;
                if (diffY > 0) {
                    if (currentIdx === totalSections - 1) {
                        scrollToSection(0);
                    } else {
                        scrollToSection(currentIdx + 1);
                    }
                } else {
                    if (currentIdx === 0) {
                        scrollToSection(totalSections - 1);
                    } else {
                        scrollToSection(currentIdx - 1);
                    }
                }

                setTimeout(() => {
                    isScrolling = false;
                }, 700);
            }
        });
    </script>
</body>
</html>
