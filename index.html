<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 제2회 거시기 연말 시상식</title>

    <style>
        /* 기본 설정 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }

        /* 🔴 좌측 인디케이터 (화면에 완전 고정) */
        .indicator {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 3000;
            transition: color 0.7s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: currentColor;
            opacity: 0.4;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .dot.active {
            width: 18px;
            height: 18px;
            opacity: 1;
            box-shadow: 0 0 10px currentColor;
            transform: translateX(-4px);
        }

        /* 📜 풀페이지 슬라이더 컨테이너 (상단바와 페이지가 한몸으로 움직임) */
        .fullpage-container {
            width: 100%;
            height: 100%;
            transition: transform 0.7s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .section {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            position: relative;
        }

        /* 🔝 각 섹션 내부에 종속된 상단바 (함께 스크롤됨) */
        .page-navbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);

            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            color: inherit;
        }

        .nav-left {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            background: transparent;
            color: inherit;
            border: 1px solid currentColor;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            opacity: 0.8;
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-center-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: -0.5px;
            white-space: nowrap;
        }

        /* 🎨 홀수 페이지 (1, 3 페이지) 색상 지정 */
        .section:nth-child(odd) {
            background-color: #522196;
            color: #5fbbef;
        }

        /* 🎨 짝수 페이지 (2, 4 페이지) 색상 지정 */
        .section:nth-child(even) {
            background-color: #ffdbd0;
            color: #cd2382;
        }

        @media (max-width: 600px) {
            .nav-center-title {
                font-size: 0.95rem;
            }
            .nav-btn {
                font-size: 0.75rem;
                padding: 5px 8px;
            }
            .indicator {
                left: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- 🔴 좌측 인디케이터 (화면 고정) -->
    <div class="indicator" id="indicatorDots">
        <div class="dot active" onclick="scrollToSection(0)"></div>
        <div class="dot" onclick="scrollToSection(1)"></div>
        <div class="dot" onclick="scrollToSection(2)"></div>
        <div class="dot" onclick="scrollToSection(3)"></div>
    </div>

    <!-- 📜 메인 4개 섹션 영역 (상단바 포함 전체 이동) -->
    <div class="fullpage-container" id="mainContainer">
        
        <!-- PAGE 1 -->
        <section class="section">
            <header class="page-navbar">
                <div class="nav-left">
                    <a href="#apply" class="nav-btn">참가지원서작성</a>
                    <a href="#vote" class="nav-btn">투표참여</a>
                </div>
                <div class="nav-center-title">2026 제2회 거시기 연말 시상식</div>
                <div style="width: 40px;"></div>
            </header>
            <h1>PAGE 1</h1>
        </section>

        <!-- PAGE 2 -->
        <section class="section">
            <header class="page-navbar">
                <div class="nav-left">
                    <a href="#apply" class="nav-btn">참가지원서작성</a>
                    <a href="#vote" class="nav-btn">투표참여</a>
                </div>
                <div class="nav-center-title">2026 제2회 거시기 연말 시상식</div>
                <div style="width: 40px;"></div>
            </header>
            <h1>PAGE 2</h1>
        </section>

        <!-- PAGE 3 -->
        <section class="section">
            <header class="page-navbar">
                <div class="nav-left">
                    <a href="#apply" class="nav-btn">참가지원서작성</a>
                    <a href="#vote" class="nav-btn">투표참여</a>
                </div>
                <div class="nav-center-title">2026 제2회 거시기 연말 시상식</div>
                <div style="width: 40px;"></div>
            </header>
            <h1>PAGE 3</h1>
        </section>

        <!-- PAGE 4 -->
        <section class="section">
            <header class="page-navbar">
                <div class="nav-left">
                    <a href="#apply" class="nav-btn">참가지원서작성</a>
                    <a href="#vote" class="nav-btn">투표참여</a>
                </div>
                <div class="nav-center-title">2026 제2회 거시기 연말 시상식</div>
                <div style="width: 40px;"></div>
            </header>
            <h1>PAGE 4</h1>
        </section>

    </div>

    <script>
        let currentIdx = 0;
        const totalSections = 4;
        let isScrolling = false;
        const container = document.getElementById('mainContainer');
        const dots = document.querySelectorAll('.dot');
        const indicator = document.getElementById('indicatorDots');

        // 각 페이지 글자색 (인디케이터 점 색상용)
        const textColors = ['#5fbbef', '#cd2382', '#5fbbef', '#cd2382'];

        function scrollToSection(index) {
            currentIdx = index;
            container.style.transform = `translateY(-${currentIdx * 100}vh)`;
            
            // 고정된 좌측 인디케이터 점 색상만 페이지 분위기에 맞게 전환
            indicator.style.color = textColors[currentIdx];

            dots.forEach((dot, idx) => {
                if (idx === currentIdx) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        scrollToSection(0);

        // 휠 스크롤 이벤트
        window.addEventListener('wheel', (e) => {
            if (isScrolling) return;
            isScrolling = true;

            if (e.deltaY > 0) {
                if (currentIdx === totalSections - 1) {
                    scrollToSection(0);
                } else {
                    scrollToSection(currentIdx + 1);
                }
            } else {
                if (currentIdx === 0) {
                    scrollToSection(totalSections - 1);
                } else {
                    scrollToSection(currentIdx - 1);
                }
            }

            setTimeout(() => {
                isScrolling = false;
            }, 700);
        }, { passive: true });

        // 터치 스와이프 이벤트
        let startY = 0;
        window.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', (e) => {
            if (isScrolling) return;
            const endY = e.changedTouches[0].clientY;
            const diffY = startY - endY;

            if (Math.abs(diffY) > 50) {
                isScrolling = true;
                if (diffY > 0) {
                    if (currentIdx === totalSections - 1) {
                        scrollToSection(0);
                    } else {
                        scrollToSection(currentIdx + 1);
                    }
                } else {
                    if (currentIdx === 0) {
                        scrollToSection(totalSections - 1);
                    } else {
                        scrollToSection(currentIdx - 1);
                    }
                }

                setTimeout(() => {
                    isScrolling = false;
                }, 700);
            }
        });
    </script>
</body>
</html>
