<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 제2회 거시기 연말 시상식</title>

    <style>
        /* 웹페이지 기본 및 배경 스타일 (단색 검정색) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-top: 60px;
            
            /* 👇 그라데이션 제거 후 완전한 검정색 지정 */
            background-color: #000000;
            color: white;
            text-align: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 🔝 상단바 고정 스타일 */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.8); /* 배경이 완전히 어두우므로 약간 투명한 검정 유지 */
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 2000;

            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }

        /* 좌측 탭 목록 (버튼) */
        .nav-left {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ffffff;
        }

        /* 중앙 제목 */
        .nav-center-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: -0.5px;
            white-space: nowrap;
        }

        /* 메인 영역 구획 */
        .main-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 📱 모바일 화면 대응 */
        @media (max-width: 600px) {
            .nav-center-title {
                font-size: 0.95rem;
            }
            .nav-btn {
                font-size: 0.75rem;
                padding: 5px 8px;
            }
        }
    </style>
</head>
<body>

    <!-- 🔝 상단바 헤더 영역 -->
    <header class="top-navbar">
        <div class="nav-left">
            <a href="#apply" class="nav-btn">참가지원서작성</a>
            <a href="#vote" class="nav-btn">투표참여</a>
        </div>
        <div class="nav-center-title">
            2026 제2회 거시기 연말 시상식
        </div>
        <div style="width: 40px;"></div>
    </header>

    <!-- 메인 컨텐츠 배치용 영역 (현재 비어있음) -->
    <main class="main-container">
    </main>

</body>
</html>
